<!doctype html>
<html lang="es">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css">

        <title>DashboardPi</title>
    </head>
    <body>

        <section  style="background-color: #4B515D;">
            <div class="container py-5 h-100">

                <div class="row d-flex justify-content-center align-items-center h-100">
                
                    
                    <div class="col-md-8 col-lg-6 col-xl-10 m-2">
                        <div class="col-md-4 col-lg-2 col-xl-2">
                        <select id="selectorEstacion" class="form-select">
                            <option value="macul">Macul</option>
                            <option value="sanjose-maipo">San José Maipo</option>
                            <option value="la-florida">La Florida</option>
                        </select>
                    </div>
                    <div class="card" style="color: #4B515D; border-radius: 35px;">
                        <div class="card-body p-4">

                            <div class="d-flex">
                            <h6 class="flex-grow-1" id="nombreEstacion">Estación</h6>
                            <h6 id ="hora">12:00</h6>
                            </div>

                            <div class="d-flex flex-column text-center mt-5 mb-4">
                            <h6 class="display-4 mb-0 font-weight-bold" style="color: #1C2331;" id="temperatura">23°C</h6>
                            <span class="small" style="color: #868B94" id="estadoCielo">Tormentas</span>
                            </div>

                            <div class="d-flex align-items-center">
                            <div class="flex-grow-1" style="font-size: 1rem;">
                                <div><i class="bi bi-wind"></i> <span class="ms-1" id="viento"> 40 km/h </span></div>
                                <div><i class="bi bi-moisture"></i> <span class="ms-1" id="humedad">50 %</span></div>
                                <div><i class="bi bi-brightness-high"></i> <span class="ms-1" id="radiacion">1000 Watt/m2</span></div>
                                
                            </div>
                            <div>
                                <i id="iconoClima" class="bi fs-1"></i>
                            </div>
                            </div>

                        </div>
                    </div>
                    <div class="card mt-4" style="color: #4B515D; border-radius: 35px;">
                        <div class="card-body p-4">

                            <h6 class="mb-4">Pronóstico 24h</h6>

                            <div id="scrollPronostico" style="overflow-x: auto;">

                                <div style="width: max-content;">

                                    <!-- Horas -->
                                    <div id="pronostico"class="d-flex">

                                    </div>

                                    <!-- Gráfico -->
                                    <div >
                                        <canvas id="graficoTemperatura"></canvas>
                                    </div>

                                </div>

                            </div>

                        </div>
                    </div>

                    

                </div>
                
            </div>
        </section>
        

        <!-- Option 1: Bootstrap Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="app.js"></script>
    </body>
</html>
